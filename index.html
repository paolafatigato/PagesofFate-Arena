<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pages of Fate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ LOBBY ============ -->
  <section id="lobby" class="screen active">
    <div class="lobby-box">
      <h1 class="logo">Pages of Fate</h1>
      <p class="tagline">A card game of Greek mythology</p>

      <label class="field-label" for="playerName">Your name</label>
      <input id="playerName" type="text" maxlength="20" placeholder="e.g. Ariadne" autocomplete="off">

      <div id="lobbyChoices">
        <button class="btn btn-gold" data-action="host">Create online game</button>
        <div class="join-row">
          <input id="joinCode" type="text" maxlength="6" placeholder="Match code" autocomplete="off">
          <button class="btn" data-action="join">Join</button>
        </div>
        <div class="divider"><span>or</span></div>
        <div class="cpu-row">
          <button class="btn" data-action="cpu">Play vs computer</button>
          <select id="cpuLevel" aria-label="Computer difficulty">
            <option value="easy">Easy</option>
            <option value="normal" selected>Normal</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <button class="btn" data-action="local">Two players on this device</button>
        <button class="btn btn-ghost" data-action="rules">Read the rules</button>
        <button class="btn btn-ghost" data-action="gallery">See all 79 cards</button>
      </div>

      <div id="lobbyWaiting" hidden>
        <p>Share this match code with your opponent:</p>
        <div id="hostCode" class="match-code">…</div>
        <p id="lobbyStatus" class="muted">Connecting to the server…</p>
        <button class="btn btn-ghost" data-action="cancel">Cancel</button>
      </div>
    </div>
  </section>

  <!-- ============ GAME ============ -->
  <section id="game" class="screen">
    <header class="topbar">
      <div class="brand">Pages of Fate</div>
      <div id="turnInfo" class="turn-info"></div>
      <div class="top-actions">
        <button class="btn btn-small btn-ghost" data-action="rules">Rules</button>
        <button class="btn btn-small btn-ghost" data-action="toggleLog">Log</button>
        <button class="btn btn-small btn-ghost" data-action="leave">Leave</button>
      </div>
    </header>

    <div id="targetBanner" class="target-banner" hidden>
      <div class="tb-text">
        <div id="tbTitle" class="tb-title"></div>
        <div id="tbPrompt" class="tb-prompt"></div>
      </div>
      <div id="tbButtons" class="tb-buttons"></div>
    </div>

    <div class="table">
      <div class="board">
        <div id="oppBar" class="player-bar opp"></div>
        <div id="oppField" class="field opp-field"></div>

        <div id="centerBar" class="center-bar">
          <div id="prompt" class="prompt"></div>
          <div id="promptButtons" class="prompt-buttons"></div>
          <button id="endTurnBtn" class="btn btn-gold" data-action="endTurn">End turn</button>
        </div>

        <div id="myField" class="field my-field"></div>
        <div id="myBar" class="player-bar me"></div>
        <div id="myHand" class="hand"></div>
      </div>

      <aside id="logPanel" class="log-panel">
        <h3>Chronicle</h3>
        <div id="logLegend" class="log-legend"></div>
        <ol id="log"></ol>
      </aside>
    </div>
  </section>

  <!-- ============ MODALS ============ -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <button class="modal-close" data-action="closeModal" aria-label="Close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="zoom" class="modal zoom-layer" hidden>
    <div class="modal-box zoom-box" role="dialog" aria-modal="true">
      <button class="modal-close" data-action="closeZoom" aria-label="Close">×</button>
      <div id="zoomBody"></div>
    </div>
  </div>

  <div id="cover" class="cover" hidden>
    <div class="cover-box">
      <h2 id="coverTitle"></h2>
      <p id="coverText"></p>
      <div id="coverButtons"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <!-- PeerJS: peer-to-peer connection for online matches -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="cards.js"></script>
  <script src="engine.js"></script>
  <script src="ai.js"></script>
  <script src="script.js"></script>
</body>
</html>
